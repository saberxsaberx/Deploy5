<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        width: 100%;
        height: 100%;
      }
      #unity-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
      }
      canvas {
        background: #000;
        touch-action: none;
      }
      #unity-loading-bar {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 8px;
        background: rgba(255,255,255,0.15);
        border-radius: 4px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        height: 100%;
        width: 0%;
        background: #09f;
        transition: width 0.2s ease;
      }
      #mobile-fullscreen-toggle {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 9999;
        background: rgba(0,0,0,0.5);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
      <button id="mobile-fullscreen-toggle">⛶</button>
    </div>

    <script>
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        webglContextAttributes: {
          preserveDrawingBuffer: false,
          powerPreference: "high-performance",
          antialias: false,
          alpha: false
        }
      };

      const canvas = document.querySelector("#unity-canvas");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenBtn = document.querySelector("#mobile-fullscreen-toggle");

      let rawDPR = window.devicePixelRatio || 1;
      let smartDPR = Math.min(Math.max(rawDPR, 0.7), 1.0);
      config.devicePixelRatio = smartDPR;

      function resizeCanvas() {
        canvas.width = window.innerWidth * smartDPR;
        canvas.height = window.innerHeight * smartDPR;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }

      // Debounced resize
      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(resizeCanvas, 250);
      });
      resizeCanvas();

      // Load Unity
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.unityInstance = unityInstance;
          setupFPSMonitor();
        }).catch((err) => alert(err));
      };
      document.body.appendChild(script);

      // Fullscreen button
      fullscreenBtn.addEventListener("click", () => {
        const elem = document.documentElement;
        if (!document.fullscreenElement) {
          elem.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });

      // 🧠 Dynamic FPS Monitor & Resolution Adjuster
      function setupFPSMonitor() {
        let lastTime = performance.now();
        let frameCount = 0;

        function loop() {
          frameCount++;
          const now = performance.now();
          if (now - lastTime >= 2000) { // هر ۲ ثانیه میانگین FPS
            const fps = (frameCount * 1000) / (now - lastTime);
            frameCount = 0;
            lastTime = now;

            if (fps < 30 && smartDPR > 0.7) {
              smartDPR -= 0.05;
              smartDPR = Math.max(smartDPR, 0.7);
              config.devicePixelRatio = smartDPR;
              resizeCanvas();
              console.log("⚠️ FPS پایین، کاهش رزولوشن → DPR:", smartDPR.toFixed(2));
            } else if (fps > 60 && smartDPR < 1.0) {
              smartDPR += 0.05;
              smartDPR = Math.min(smartDPR, 1.0);
              config.devicePixelRatio = smartDPR;
              resizeCanvas();
              console.log("✅ FPS بالا، افزایش رزولوشن → DPR:", smartDPR.toFixed(2));
            }
          }
          requestAnimationFrame(loop);
        }
        loop();
      }
    </script>
  </body>
</html>
