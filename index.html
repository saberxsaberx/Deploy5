<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Flagm8</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="unity-webview.js"></script>
    <style>
        #mobile-fullscreen-toggle {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 99999;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 36px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        #mobile-fullscreen-toggle.active {
            background: rgba(0,0,0,0.85);
        }
        @media (max-width: 900px) {
            #unity-container.unity-mobile, #unity-canvas {
                width: 100vw !important;
                height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            html, body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        }
    </style>
    <style>
        #mobile-portrait-overlay {
            display: none;
            position: fixed;
            z-index: 2147483647 !important;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #mobile-portrait-overlay img {
            max-width: 100vw;
            max-height: 100vh;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            pointer-events: auto;
        }
        @media (max-width: 900px) and (orientation: portrait) {
            #mobile-portrait-overlay {
                display: flex !important;
            }
        }
        @media (orientation: landscape) {
            #mobile-portrait-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>
<div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>
    <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Flagm8</div>
    </div>
    <button id="mobile-fullscreen-toggle" title="Toggle Fullscreen">⛶</button>
    <div id="mobile-portrait-overlay">
        <img src="ax.png" alt="ax" />
    </div>
</div>
<script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/FM8V004.loader.js";
    var config = {
        dataUrl: buildUrl + "/FM8V004.data.unityweb",
        frameworkUrl: buildUrl + "/FM8V004.framework.js.unityweb",
        codeUrl: buildUrl + "/FM8V004.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Neoki",
        productName: "Flagm8",
        productVersion: "0.0.1",
        webglContextAttributes: {
            preserveDrawingBuffer: false,
            powerPreference: "high-performance",
            antialias: false,
            alpha: false
        }
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var width0 = "1066px";
    var height0 = "600px";

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile) {
        container.className = "unity-mobile";

        var rawDPR = window.devicePixelRatio || 1;
        var maxDPR = 2.0;
        var minDPR = 1;
        var baseWidth = window.innerWidth;
        //if (baseWidth > 1080) maxDPR = 2.0;
        //if (baseWidth < 720) minDPR = 1;

        var smartDPR = Math.min(Math.max(rawDPR, minDPR), maxDPR);
        config.devicePixelRatio = smartDPR;

        function resizeCanvas() {
            const targetWidth = window.innerWidth * smartDPR;
            const targetHeight = window.innerHeight * smartDPR;
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        function fitMobileCanvas() {
            resizeCanvas();
            container.style.width = "100vw";
            container.style.height = "100vh";
        }

        fitMobileCanvas();
        let resizeTimeout;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(fitMobileCanvas, 250);
        });
        window.addEventListener("orientationchange", fitMobileCanvas);

        document.getElementById('mobile-fullscreen-toggle').style.display = "block";
    } else {
        function fitDesktopCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
            container.style.width = "100vw";
            container.style.height = "100vh";
        }
        fitDesktopCanvas();
        window.addEventListener("resize", fitDesktopCanvas);
        window.addEventListener("orientationchange", fitDesktopCanvas);
        document.getElementById('mobile-fullscreen-toggle').style.display = "block";
    }

    loadingBar.style.display = "block";

    document.addEventListener('fullscreenchange', function() {
        var p = document.getElementById('unity-container');
        var c = document.getElementById('unity-canvas');
        if (document.fullscreenElement) {
            width0 = c.style.width;
            height0 = c.style.height;
            setTimeout(function() {
                c.style.width = getComputedStyle(p).width;
                c.style.height = getComputedStyle(p).height;
            }, 250);
        } else {
            c.style.width = width0;
            c.style.height = height0;
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                if (typeof fitMobileCanvas === "function") fitMobileCanvas();
            } else {
                if (typeof fitDesktopCanvas === "function") fitDesktopCanvas();
            }
        }
    });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
            window.unityInstance = unityInstance;
            loadingBar.style.display = "none";

            // 🎯 FPS Monitor & Auto Resolution Adjuster (حداقل فریم 30)
            (function setupFPSMonitor() {
                let smartDPR = config.devicePixelRatio || 1.0;
                let lastTime = performance.now();
                let frameCount = 0;
                const fpsTarget = 30;
                const minDPR = 1;
                const maxDPR = 2;

                function adjustResolution(currentFps) {
                    if (currentFps < fpsTarget && smartDPR > minDPR) {
                        smartDPR = Math.max(smartDPR - 0.05, minDPR);
                        config.devicePixelRatio = smartDPR;
                        console.log("⚠️ FPS پایین → کاهش رزولوشن → DPR:", smartDPR.toFixed(2));
                        resizeCanvas();
                    } else if (currentFps > fpsTarget + 10 && smartDPR < maxDPR) {
                        smartDPR = Math.min(smartDPR + 0.05, maxDPR);
                        config.devicePixelRatio = smartDPR;
                        console.log("✅ FPS بالا → افزایش رزولوشن → DPR:", smartDPR.toFixed(2));
                        resizeCanvas();
                    }
                }

                function monitor() {
                    frameCount++;
                    const now = performance.now();
                    if (now - lastTime >= 2000) {
                        const fps = (frameCount * 1000) / (now - lastTime);
                        frameCount = 0;
                        lastTime = now;
                        //adjustResolution(fps);
                    }
                    //requestAnimationFrame(monitor);
                }

                //monitor();
            })();

            fullscreenButton.onclick = () => {
                var p = document.getElementById('unity-container');
                var c = document.getElementById('unity-canvas');
                c.requestFullscreen = () => {
                    p.requestFullscreen();
                };
                unityInstance.SetFullscreen(1);
            };
        }).catch((message) => {
            alert(message);
        });

        if (!isMobile) {
            var elem = document.getElementById('unity-container');
            setTimeout(function() {
                if (!document.fullscreenElement) {
                    if (elem.requestFullscreen) elem.requestFullscreen();
                    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                    else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
                }
            }, 500);
        }
    };
    document.body.appendChild(script);

    var fsBtn = document.getElementById('mobile-fullscreen-toggle');
    function updateFSBtn() {
        fsBtn.style.display = "block";
        if (document.fullscreenElement) {
            fsBtn.textContent = "←";
            fsBtn.classList.add("active");
        } else {
            fsBtn.textContent = "⛶";
            fsBtn.classList.remove("active");
        }
    }
    fsBtn.addEventListener("click", function() {
        var elem = document.getElementById('unity-container');
        if (!document.fullscreenElement) {
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    });
    document.addEventListener('fullscreenchange', updateFSBtn);
    document.addEventListener('webkitfullscreenchange', updateFSBtn);
    document.addEventListener('msfullscreenchange', updateFSBtn);
    updateFSBtn();
</script>

<script>
    function updateMobilePortraitOverlay() {
        var overlay = document.getElementById('mobile-portrait-overlay');
        if (!overlay) return;
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (!isMobile) {
            overlay.style.display = "none";
            return;
        }
        var portrait = false;
        if (window.matchMedia) {
            portrait = window.matchMedia("(orientation: portrait)").matches;
        } else if (window.orientation !== undefined) {
            portrait = (window.orientation === 0 || window.orientation === 180);
        } else {
            portrait = window.innerHeight > window.innerWidth;
        }
        var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
        if (portrait && isFullscreen) {
            overlay.style.display = "flex";
        } else {
            overlay.style.display = portrait ? "flex" : "none";
        }
    }
    window.addEventListener("orientationchange", updateMobilePortraitOverlay);
    window.addEventListener("resize", updateMobilePortraitOverlay);
    document.addEventListener("DOMContentLoaded", updateMobilePortraitOverlay);
    document.addEventListener("fullscreenchange", updateMobilePortraitOverlay);
    document.addEventListener("webkitfullscreenchange", updateMobilePortraitOverlay);
    document.addEventListener("msfullscreenchange", updateMobilePortraitOverlay);
</script>
</body>
</html>
